[output]
root = "result"
#run = "run"

[experiment]
mode = "scalar"
seed = 42

[training]
num_steps = 5

[training.optimizer]
lr = 1e-5
weight_decay = 0.0

[training.dpo]
beta = 0.1

[pairing]
top_k = 2
bottom_k = 2

[critic]
model = "gpt-5.5-pro"
max_retries = 3

[artist]
model = "meta-llama/Meta-Llama-3.1-8B-Instruct"

[artist.generate]
max_new_tokens = 300
temperature = 1.0
num_return_sequences = 8

[artist.lora]
r = 16
lora_alpha = 32
lora_dropout = 0.05